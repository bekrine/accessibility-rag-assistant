services:

  postgres:
    image: postgres:16
    container_name: rag-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_inclusion

    # No published port: only reachable from other containers on this network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_inclusion"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:6.2
    container_name: rag-redis

    # No published port: only reachable from other containers on this network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-api

    # No published port: only reachable from other containers (frontend's nginx proxies /api/ to it).
    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_SERVICE_URL: http://rag-service:8000
      FRONTEND_ORIGIN: https://accessibility-rag.duckdns.org

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile

    container_name: rag-service

    # No published port: only reachable from other containers.
    env_file:
      - ./rag-service/.env

    environment:
      BACKEND_URL: http://api:5000

    volumes:
      - chroma_data:/app/chroma_db
      - hf_cache:/root/.cache/huggingface

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  rag-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-worker

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_SERVICE_URL: http://rag-service:8000

    command: node src/workers/ragWorker.js

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_healthy

    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: outbox-publisher

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: node src/workers/outboxPublisher.js

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""

    container_name: rag-frontend

    # No published port: only reachable from Caddy on the internal network.
    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: rag-caddy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      frontend:
        condition: service_started

    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  hf_cache:
  caddy_data:
  caddy_config:
