services:

  postgres:
    image: postgres:16
    container_name: rag-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_inclusion

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_inclusion"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:6.2
    container_name: rag-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-api

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_SERVICE_URL: http://rag-service:8000

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile

    container_name: rag-service

    ports:
      - "8000:8000"

    env_file:
      - ./rag-service/.env

    environment:
      BACKEND_URL: http://api:5000

    volumes:
      - chroma_data:/app/chroma_db
      - hf_cache:/root/.cache/huggingface

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  rag-worker:
      build:
        context: ./backend
        dockerfile: Dockerfile

      container_name: rag-worker

      env_file:
        - ./backend/.env

      environment:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
        DATABASE_SSL: "false"
        REDIS_HOST: redis
        REDIS_PORT: 6379
        RAG_SERVICE_URL: http://rag-service:8000

      command: node src/workers/ragWorker.js

      depends_on:
        postgres:
          condition: service_healthy

        redis:
          condition: service_healthy

        rag-service:
          condition: service_healthy

      restart: unless-stopped

  outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: outbox-publisher

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_inclusion
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: node src/workers/outboxPublisher.js

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000

    container_name: rag-frontend

    ports:
      - "5173:80"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  hf_cache: